<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanWe..?</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Press+Start+2P&family=VT323&display=swap');

    :root {
      --bg-base: #070b16;
      --bg-deep: #05070f;
      --bg-mid: #101a31;
      --line-soft: rgba(210, 236, 255, 0.2);
      --card-bg: linear-gradient(145deg, rgba(14, 20, 42, 0.92), rgba(7, 10, 24, 0.9));
      --txt-main: #e8f4ff;
      --txt-dim: #98acc3;

      --neon-g: #52ff9a;
      --neon-p: #ff5b8a;
      --neon-y: #ffd166;
      --neon-c: #6de5ff;
      --neon-r: #ff6b6b;
      --neon-b: #88a8ff;

      --accent-intro: rgba(82, 255, 154, .86);
      --accent-form: rgba(255, 91, 138, .9);
      --accent-choice: rgba(255, 209, 102, .9);
      --accent-win: rgba(109, 229, 255, .9);
      --accent-fail: rgba(255, 107, 107, .88);

      --rad-lg: 24px;
      --rad-md: 16px;
      --rad-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(1300px 700px at 12% 0%, rgba(63, 113, 255, 0.18), transparent 62%),
        radial-gradient(1000px 600px at 90% 100%, rgba(255, 107, 107, 0.12), transparent 60%),
        linear-gradient(160deg, var(--bg-base), var(--bg-mid) 45%, var(--bg-deep));
      font-family: 'Press Start 2P', monospace;
      color: var(--txt-main);
      overflow: hidden;
      position: relative;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom,
          rgba(255, 255, 255, 0.022) 0,
          rgba(255, 255, 255, 0.022) 1px,
          transparent 1px,
          transparent 3px);
      mix-blend-mode: soft-light;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(2, 5, 12, 0) 45%, rgba(1, 2, 8, 0.8) 100%);
    }

    .music-toggle {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 30;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: var(--txt-main);
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      transition: color .2s ease, transform .2s ease;
      display: none;
    }

    .music-toggle:hover { transform: scale(1.08); }
    .music-toggle[aria-pressed="true"] { color: var(--neon-c); }
    .music-toggle svg { width: 18px; height: 18px; }
    .music-toggle .volume-off { display: none; }
    .music-toggle[aria-pressed="false"] .volume-off { display: block; }
    .music-toggle[aria-pressed="false"] .volume-on { display: none; }
    .music-toggle.visible { display: grid; }

    .audio-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }


    .screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
      padding: clamp(0.8rem, 3vw, 1.4rem);
      min-height: 100dvh;
      width: 100%;
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.93);
    }

    .card {
      position: relative;
      width: min(94vw, 620px);
      max-width: 620px;
      padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1.1rem, 2.6vw, 2.2rem);
      margin-inline: auto;
      border-radius: var(--rad-lg);
      background: var(--card-bg);
      border: 3px solid var(--line-soft);
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow:
        0 26px 48px rgba(0, 0, 0, 0.45),
        0 0 24px rgba(47, 118, 255, 0.18);
      animation: panelRise .45s ease;
    }

    .card::before {
      content: none;
    }

    .card::after {
      content: none;
    }

    .card-green {
      border-color: rgba(82, 255, 154, 0.82);
      box-shadow:
        0 24px 44px rgba(0, 0, 0, 0.45),
        0 0 28px rgba(82, 255, 154, 0.3);
    }

    .card-pink {
      border-color: rgba(255, 91, 138, 0.84);
      box-shadow:
        0 24px 44px rgba(0, 0, 0, 0.45),
        0 0 28px rgba(255, 91, 138, 0.28);
    }

    .card-yellow {
      border-color: rgba(255, 209, 102, 0.86);
      box-shadow:
        0 24px 44px rgba(0, 0, 0, 0.45),
        0 0 28px rgba(255, 209, 102, 0.3);
    }

    .card-danger {
      border-color: rgba(255, 107, 107, 0.9);
      box-shadow:
        0 24px 44px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(255, 107, 107, 0.3);
    }

    #screen1 .card {
      border-color: var(--accent-intro);
    }

    #screen2 .card {
      border-color: var(--accent-form);
    }

    #screen3 .card {
      border-color: var(--accent-choice);
    }

    #screen5 .card {
      border-color: var(--accent-fail);
    }

    .quest-note {
      font-size: .5rem;
      color: var(--txt-dim);
      line-height: 2.3;
      margin-bottom: .8rem;
      letter-spacing: .08em;
    }

    /* S1 */
    #screen1 .blink {
      font-size: clamp(.62rem, 1.8vw, .84rem);
      color: var(--neon-g);
      text-shadow: 0 0 10px rgba(82, 255, 154, 0.8);
      animation: blink 1.1s steps(1) infinite;
      margin-top: 1.1rem;
    }

    /* S2 */
    #screen2 h2,
    #screen3 h2 {
      letter-spacing: .05em;
      margin-bottom: .8rem;
      line-height: 1.8;
    }

    #screen2 h2 {
      font-size: clamp(.74rem, 2vw, .98rem);
      color: var(--neon-p);
      text-shadow: 0 0 12px rgba(255, 91, 138, .7);
    }

    #screen2 input {
      width: 100%;
      padding: .95rem 1rem;
      font-family: 'Press Start 2P', monospace;
      font-size: .7rem;
      background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
      border: 2px solid rgba(255, 91, 138, .72);
      border-radius: var(--rad-md);
      color: #fff;
      outline: none;
      text-align: center;
      margin-bottom: 1.2rem;
      box-shadow: inset 0 0 14px rgba(0, 0, 0, .35), 0 0 16px rgba(255, 91, 138, .22);
      text-transform: capitalize;
      transition: transform .15s ease, box-shadow .2s ease;
    }

    #screen2 input:focus {
      transform: translateY(-1px);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, .35), 0 0 0 3px rgba(255, 91, 138, .25), 0 0 18px rgba(255, 91, 138, .32);
    }

    #screen2 input::placeholder {
      color: #c4b3bc;
    }

    #screen2 .next-btn,
    .btn-yes,
    .btn-no,
    .dl-btn {
      font-family: 'Press Start 2P', monospace;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: .5px;
      transition: transform .13s ease, filter .18s ease, box-shadow .2s ease;
    }

    #screen2 .next-btn {
      font-size: .67rem;
      padding: .84rem 1.9rem;
      background: linear-gradient(180deg, #ff87ab, #ff5b8a);
      color: #22040f;
      box-shadow: 0 8px 0 #b3335c, 0 0 18px rgba(255, 91, 138, .45);
    }

    #screen2 .next-btn:hover,
    .btn-yes:hover,
    .btn-no:hover,
    .dl-btn:hover {
      transform: translateY(-2px) scale(1.01);
    }

    #screen2 .next-btn:active,
    .btn-yes:active,
    .btn-no:active,
    .dl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .45);
    }

    /* S3 */
    #screen3 h2 {
      font-size: clamp(.95rem, 3vw, 1.45rem);
      color: var(--neon-y);
      text-shadow: 0 0 14px rgba(255, 209, 102, .72);
      animation: glitch 3s steps(1) infinite;
    }

    #screen3 .subq {
      font-size: .53rem;
      color: #ced8e8;
      margin-bottom: 1.6rem;
      line-height: 2.2;
      white-space: pre-line;
    }

    .choice-btns {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-yes,
    .btn-no {
      font-size: .7rem;
      padding: .9rem 1.9rem;
      min-width: 130px;
    }

    .btn-yes {
      background: linear-gradient(180deg, #9dffc5, var(--neon-g));
      color: #002210;
      box-shadow: 0 7px 0 #1f8a57, 0 0 16px rgba(82, 255, 154, .4);
    }

    .btn-no {
      background: linear-gradient(180deg, #ff9a9a, var(--neon-r));
      color: #2a0404;
      box-shadow: 0 7px 0 #a03434, 0 0 16px rgba(255, 107, 107, .35);
    }

    /* S4 */
    #screen4 {
      flex-direction: column;
      overflow: hidden;
    }

    #celebCanvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #rainCanvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #screen4 .gift-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(94vw, 620px);
      max-width: 620px;
      margin-inline: auto;
      padding: 1.2rem;
      border-radius: var(--rad-lg);
      background: linear-gradient(150deg, rgba(9, 13, 30, .64), rgba(6, 9, 22, .42));
      border: 3px solid var(--accent-win);
      backdrop-filter: blur(2px);
      box-shadow:
        0 20px 38px rgba(0, 0, 0, .45),
        0 0 24px rgba(109, 229, 255, .3);
    }

    #joyGif {
      width: 164px;
      height: 164px;
      overflow: hidden;
      display: block;
      object-fit: cover;
    }

    #screen4 .yay-text {
      font-size: clamp(.76rem, 2.2vw, 1.08rem);
      animation: rainbow 1.4s linear infinite;
      margin-top: 1rem;
      letter-spacing: .04em;
    }

    #screen4 .friend-name-big {
      font-size: clamp(.62rem, 1.8vw, .9rem);
      color: var(--neon-c);
      margin-top: .45rem;
      text-shadow: 0 0 10px rgba(109, 229, 255, .8);
    }

    #screen4 .action-btns {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.1rem;
    }

    .dl-btn {
      font-size: .52rem;
      padding: .73rem 1.08rem;
    }

    .dl-btn {
      background: linear-gradient(180deg, #a9ffcb, var(--neon-g));
      color: #012614;
      box-shadow: 0 6px 0 #1f8a57, 0 0 14px rgba(82, 255, 154, .4);
    }

    #certStatus {
      font-size: .46rem;
      color: var(--neon-g);
      min-height: 1rem;
      margin-top: .46rem;
      text-shadow: 0 0 6px rgba(82, 255, 154, .5);
    }

    /* S5 */
    #screen5 {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #screen5 .sad-gif {
      width: 170px;
      margin-bottom: 1rem;
    }

    #screen5 .sad-msg {
      font-size: .5rem;
      color: #d2bdc0;
      line-height: 2.2;
      margin-bottom: 1.2rem;
    }

    #lockNotice {
      font-size: .34rem;
      color: #ffb6b6;
      line-height: 1.9;
      min-height: 1.1rem;
      text-shadow: 0 0 10px rgba(255, 107, 107, .35);
      display: none;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #lockNotice.show {
      display: block;
      opacity: 1;
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1
      }

      50%,
      100% {
        opacity: 0
      }
    }

    @keyframes rainbow {
      0% {
        color: #ff6b6b
      }

      16% {
        color: #ff9f43
      }

      33% {
        color: #ffd166
      }

      50% {
        color: #52ff9a
      }

      66% {
        color: #6de5ff
      }

      83% {
        color: #90a7ff
      }

      100% {
        color: #ff6b6b
      }
    }

    @keyframes glitch {

      0%,
      88%,
      100% {
        transform: none;
        text-shadow: 0 0 14px rgba(255, 209, 102, .75)
      }

      90% {
        transform: skewX(-4deg) translateX(3px);
        text-shadow: -2px 0 rgba(255, 91, 138, .8), 2px 0 rgba(109, 229, 255, .8)
      }

      92% {
        transform: skewX(4deg) translateX(-2px)
      }

      94% {
        transform: none
      }
    }

    @keyframes panelRise {
      from {
        opacity: .5;
        transform: translateY(8px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (min-width: 1024px) {
      .screen {
        padding: 1.4rem;
      }

      .card {
        width: min(82vw, 700px);
        padding: 2rem 2.3rem;
      }

      #screen2 h2,
      #screen3 h2 {
        font-size: clamp(.86rem, 1.3vw, 1.08rem);
      }

      #screen2 input {
        font-size: .72rem;
      }

      #screen2 .next-btn,
      .btn-yes,
      .btn-no,
      .dl-btn {
        font-size: .56rem;
      }

      #screen4 .gift-wrap {
        padding: 1.35rem 1.2rem;
      }

      #joyGif,
      #screen5 .sad-gif {
        width: 176px;
        height: 176px;
      }
    }

    @media (min-width: 1440px) {
      .card {
        width: min(70vw, 760px);
      }

      #screen4 .action-btns {
        gap: 1rem;
      }

      #screen4 .yay-text {
        font-size: 1.12rem;
      }
    }

    @media (max-width: 900px) {
      .card {
        width: min(96vw, 620px);
        padding: 1.35rem 1rem 1.55rem;
      }

      #screen2 h2,
      #screen3 h2 {
        line-height: 1.6;
      }

      #screen4 .gift-wrap {
        padding: 1rem .9rem 1.15rem;
      }
    }

    @media (max-width: 640px) {
      .screen {
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
      }

      .card {
        width: min(95vw, 620px);
        padding: 1.35rem .95rem 1.55rem;
        border-radius: 18px;
      }

      .card {
        border-color: rgba(210, 236, 255, .38);
        box-shadow:
          0 22px 40px rgba(0, 0, 0, .5),
          0 0 24px rgba(109, 229, 255, .18);
      }

      #screen2 h2,
      #screen3 h2 {
        font-size: clamp(.68rem, 4.2vw, .86rem);
      }

      #screen2 input {
        font-size: .62rem;
        padding: .82rem .75rem;
      }

      #screen2 .next-btn,
      .btn-yes,
      .btn-no,
      .dl-btn {
        font-size: .5rem;
        padding: .72rem .9rem;
      }

      .choice-btns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .65rem;
      }

      .btn-yes,
      .btn-no {
        width: 100%;
        min-width: 0;
        max-width: none;
        padding: .72rem .3rem;
        font-size: clamp(.42rem, 2.5vw, .5rem);
        white-space: nowrap;
      }

      #joyGif {
        width: 136px;
        height: 136px;
        border-radius: 16px;
      }

      .dl-btn {
        width: 100%;
        max-width: 260px;
      }

      #screen4 .action-btns {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .card {
        width: 96vw;
        padding: 1.1rem .75rem 1.25rem;
      }

      .quest-note {
        font-size: .42rem;
        line-height: 2;
      }

      #screen4 .yay-text {
        font-size: .64rem;
      }

      #screen4 .friend-name-big,
      #certStatus,
      #screen5 .sad-msg {
        font-size: .44rem;
      }

      #joyGif,
      #screen5 .sad-gif {
        width: 124px;
        height: 124px;
      }
    }

    @media (max-height: 700px) and (min-width: 641px) {
      .screen {
        align-items: center;
        overflow-y: auto;
      }

      .card,
      #screen4 .gift-wrap {
        margin-top: 0;
        margin-bottom: 0;
      }
    }

    #nameError {
      font-size: .45rem;
      color: var(--neon-r);
      text-shadow: 0 0 8px rgba(255, 107, 107, .6);
      margin-top: -0.6rem;
      margin-bottom: 0.9rem;
      min-height: 0.6rem;
      text-align: center;
      letter-spacing: .05em;
    }
  </style>
</head>

<body>

  <button class="music-toggle" id="musicToggle" type="button" aria-label="Turn music off" aria-pressed="true" title="Turn music off">
    <svg class="volume-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4V5Z" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M19 5a10 10 0 0 1 0 14" />
    </svg>
    <svg class="volume-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4V5Z" /><path d="m16 9 5 6m0-6-5 6" />
    </svg>
  </button>
  <audio class="audio-only" id="happyMusic" src="happy-happy-happy-cat.mp3" loop preload="auto"></audio>
  <audio class="audio-only" id="sadMusic" src="crying-cat.mp3" loop preload="auto"></audio>

  <canvas id="bgCanvas"></canvas>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- SCREEN 1 -->
  <div class="screen" id="screen1">
    <div class="card card-green" style="cursor:pointer" id="tapCard">
      <canvas id="heartCanvas" width="64" height="56"
        style="display:block;margin:0 auto 1rem;image-rendering:pixelated;width:64px;height:56px;"></canvas>
      <div class="quest-note">
        A QUEST AWAITS YOU
      </div>
      <div class="blink">► PRESS START ◄</div>
    </div>
  </div>

  <!-- SCREEN 2 -->
  <div class="screen hidden" id="screen2">
    <div class="card card-pink">
      <h2>ENTER YOUR NAME</h2>
      <input type="text" id="nameInput" placeholder="YOUR NAME HERE" maxlength="24" autocomplete="off" />
      <div id="nameError" style="display: none;"></div>
      <button class="next-btn" id="nameNextBtn">CONFIRM ►</button>
    </div>
  </div>

  <!-- SCREEN 3 -->
  <div class="screen hidden" id="screen3">
    <div class="card card-yellow">
      <h2>CAN WE BE GOOD FRIENDS?</h2>
      <div class="subq" id="canWeSubQ"></div>
      <div class="choice-btns">
        <button class="btn-yes" id="yesBtn">✓ YES</button>
        <button class="btn-no" id="noBtn">✗ NO</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 4 -->
  <div class="screen hidden" id="screen4">
    <canvas id="celebCanvas"></canvas>
    <canvas id="rainCanvas"></canvas>
    <div class="gift-wrap">
      <img id="joyGif" src="if_yes.gif" alt="happy" />
      <div class="yay-text">FRIENDSHIP UNLOCKED!</div>
      <div class="friend-name-big" id="celebName"></div>
      <div class="action-btns">
        <button class="dl-btn" id="dlCertBtn">⬇ CERTIFICATE</button>
      </div>
      <div id="certStatus"></div>
    </div>
  </div>

  <!-- SCREEN 5 -->
  <div class="screen hidden" id="screen5">
    <div class="card card-pink card-danger">
      <img class="sad-gif" src="if_no.gif" alt="sad" />
      <div class="sad-msg">OKAY...<br>I UNDERSTAND...</div>
      <div id="lockNotice"></div>
    </div>
  </div>

  <!-- THIRD-PARTY LIBRARIES (jsPDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./config.js"></script>

  <script type="module">
    /* ADDED SECTION: Firebase imports from CDN (v10 modular SDK) */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ═══════════════════════════════════════════════════════
    // 1. Firebase Initialization (Using Firestore Only)
    // ═══════════════════════════════════════════════════════
    /* ADDED SECTION: Firebase configuration object and client initialization */
    // REPLACE WITH YOUR ACTUAL FIREBASE CONFIGURATION KEYS
    const firebaseConfig = window.APP_CONFIG?.firebase;
    if (!firebaseConfig?.apiKey || !firebaseConfig?.projectId || !firebaseConfig?.appId) {
      throw new Error("Firebase config is missing. Add the Firebase settings to config.js.");
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

        paw.translate(x, y);
        paw.rotate(rotation);
        const grad = paw.createRadialGradient(-rx * .28, -ry * .35, 2, 0, 0, Math.max(rx, ry) * 1.15);
        grad.addColorStop(0, '#c77c70');
        grad.addColorStop(.48, '#a84e48');
        grad.addColorStop(1, '#71302e');
        paw.fillStyle = grad;
        paw.beginPath();
        paw.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        paw.fill();
        paw.shadowColor = 'transparent';
        paw.fillStyle = 'rgba(255, 218, 196, .22)';
        paw.beginPath();
        paw.ellipse(-rx * .24, -ry * .36, rx * .46, ry * .2, -.15, 0, Math.PI * 2);
        paw.fill();
        paw.restore();
      };
      drawPad(72, 90, 34, 43, -.32);
      drawPad(139, 56, 35, 45, -.12);
      drawPad(207, 63, 35, 45, .16);
      drawPad(265, 111, 33, 42, .38);
      drawPad(165, 194, 70, 57, 0);
      doc.addImage(pawCanvas.toDataURL('image/png'), 'PNG', cx - 27, H - 125, 54, 58);

      // Date
      const now = new Date();
      const ds = now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      doc.setFont('times', 'italic');
      doc.setFontSize(10.5);
      doc.setTextColor(96, 68, 38);
      doc.text(`Issued on ${ds}`, W - 56, H - 58, { align: 'right' });

      return doc;
    }

    async function generateCert(name, clearStatus = true) {
      const doc = await createCertificateDoc(name);
      if (!doc) return;
      const fn = `friendship-cert-${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.pdf`;
      doc.save(fn);

      const statusEl = document.getElementById('certStatus');
      if (statusEl) {
        statusEl.textContent = '✓ CERTIFICATE DOWNLOADED!';
        if (clearStatus) {
          setTimeout(() => {
            if (statusEl.textContent === '✓ CERTIFICATE DOWNLOADED!') {
              statusEl.textContent = '';
            }
          }, 3000);
        }
      }
    }
  </script>
